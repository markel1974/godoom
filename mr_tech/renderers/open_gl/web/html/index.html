<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GoDoom Wasm</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0f0; font-family: monospace; font-size: 24px; }
    </style>
</head>
<body>
<div id="loading">Initializing ...</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<script src="wasm_exec.js"></script>
<script>
    if (!WebAssembly.instantiateStreaming) {
        WebAssembly.instantiateStreaming = async (resp, importObject) => {
            const source = await (await resp).arrayBuffer();
            return await WebAssembly.instantiate(source, importObject);
        };
    }
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("godoom.wasm?t=" + Date.now()), go.importObject).then((result) => {
        document.getElementById("loading").style.display = "none";
        go.run(result.instance);
    }).catch(err => {
        console.error("WASM Error:", err);
        document.getElementById("loading").innerText = "Error: check your console (F12)";
        document.getElementById("loading").style.color = "red";
    });
</script>
</body>
</html>
